# The Rust binding. Directory by role, package by name: `sys` is the raw layer
# `koru-sys`, `macros` is `koru-macros`, and `runtime` is `koru` itself, which
# holds the futures, the executor and Braam's surface.
[workspace]
members = ["sys", "macros", "runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
