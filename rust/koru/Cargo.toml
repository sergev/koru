[package]
name = "koru"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "koru futures, op slab and single-threaded executor"

# No dependencies but koru-sys, deliberately: the workspace lockfile listing
# nothing but its own packages is what proves the build needs no registry.
[dependencies]
koru-sys = { path = "../koru-sys" }

# Declared rather than autodiscovered, like koru-sys's.
[[test]]
name = "runtime"
path = "tests/runtime.rs"
