# No dependencies, deliberately: the ABI is reached through hand-declared libc
# prototypes in src/sys.rs, so the build needs no registry and no network.
[package]
name = "koru-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "koru ABI structs, ioctl wrappers and the errno table"

[dependencies]

[[test]]
name = "kernel"
path = "tests/kernel.rs"

# Declared rather than autodiscovered, like the test above.
[[bin]]
name = "abi_dump"
path = "src/bin/abi_dump.rs"
